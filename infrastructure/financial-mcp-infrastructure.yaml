AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Infrastructure for the Spring AI Financial MCP Server.
  Creates VPC, public subnets, ALB, ECS Fargate service,
  security groups, IAM execution role and CloudWatch logs.

Parameters:

  ContainerImage:
    Type: String
    Description: ECR image URI for the Financial MCP Server

  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port on which the Spring Boot application listens

  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of ECS tasks to run

  Cpu:
    Type: String
    Default: '256'
    Description: ECS task CPU units (256 = 0.25 vCPU)

  Memory:
    Type: String
    Default: '512'
    Description: ECS task memory in MB

Resources:

  # ============================================================
  # VPC
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: financial-mcp-vpc

  # ============================================================
  # Internet Gateway
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: financial-mcp-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # ============================================================
  # Public Subnet 1
  # ============================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: financial-mcp-public-subnet-1

  # ============================================================
  # Public Subnet 2
  # ============================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: financial-mcp-public-subnet-2

  # ============================================================
  # Route Table
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: financial-mcp-public-route-table

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # ============================================================
  # ALB Security Group
  # ============================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: financial-mcp-alb-sg

  # ============================================================
  # ECS Security Group
  # ============================================================

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MCP traffic only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: financial-mcp-ecs-sg

  # ============================================================
  # Application Load Balancer
  # ============================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: financial-mcp-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: financial-mcp-alb

  # ============================================================
  # Target Group
  # ============================================================

  MCPTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: financial-mcp-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC

      HealthCheckEnabled: true
      HealthCheckPath: /actuator/health
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

      Tags:
        - Key: Name
          Value: financial-mcp-target-group

  # ============================================================
  # ALB Listener
  # ============================================================

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MCPTargetGroup

  # ============================================================
  # ECS Cluster
  # ============================================================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: financial-mcp-cluster
      Tags:
        - Key: Name
          Value: financial-mcp-cluster

  # ============================================================
  # CloudWatch Log Group
  # ============================================================

  MCPLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/financial-mcp-server
      RetentionInDays: 7

  # ============================================================
  # ECS Task Execution Role
  # ============================================================

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: financial-mcp-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      Tags:
        - Key: Name
          Value: financial-mcp-ecs-execution-role

  # ============================================================
  # ECS Task Definition
  # ============================================================

  MCPTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: financial-mcp-server
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE

      Cpu: !Ref Cpu
      Memory: !Ref Memory

      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:
        - Name: financial-mcp-server
          Image: !Ref ContainerImage

          Essential: true

          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MCPLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ============================================================
  # ECS Service
  # ============================================================

  MCPService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener

    Properties:
      ServiceName: financial-mcp-service
      Cluster: !Ref ECSCluster

      LaunchType: FARGATE

      DesiredCount: !Ref DesiredCount

      TaskDefinition: !Ref MCPTaskDefinition

      HealthCheckGracePeriodSeconds: 60

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

      LoadBalancers:
        - ContainerName: financial-mcp-server
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref MCPTargetGroup

      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0

      Tags:
        - Key: Name
          Value: financial-mcp-service

# ================================================================
# Outputs
# ================================================================

Outputs:

  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS Service Name
    Value: !GetAtt MCPService.Name

  LoadBalancerDNS:
    Description: Application Load Balancer DNS name
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  MCPURL:
    Description: MCP endpoint
    Value: !Sub
      - http://${DNSName}/mcp
      - DNSName: !GetAtt ApplicationLoadBalancer.DNSName

  HealthURL:
    Description: Health check endpoint
    Value: !Sub
      - http://${DNSName}/actuator/health
      - DNSName: !GetAtt ApplicationLoadBalancer.DNSName