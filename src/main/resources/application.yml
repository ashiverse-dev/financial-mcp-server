spring:
  application:
    name: financial-mcp-server

#  main:
#    web-application-type: none

  ai:
    mcp:
      server:
        name: financial-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: >
          This MCP server provides banking and financial information
          for authenticated customers.
        #stdio: true
        protocol: STREAMABLE #not for local

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true